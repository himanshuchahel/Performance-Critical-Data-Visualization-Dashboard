version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dataforge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CLIENT_URL=http://localhost
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/dataforge}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY:-}
      - B2_BUCKET_ID=${B2_BUCKET_ID:-}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME:-}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dataforge-net

  mongodb:
    image: mongo:7-alpine
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - dataforge-net

networks:
  dataforge-net:
    driver: bridge

volumes:
  mongodb-data:
  backend-uploads:
